<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="Лого.webp" type="image/x-icon">
    <link rel="stylesheet" href="auto.css">
    <title>Авторизация "Время действий"</title>
</head>
<body>
    <header>
        <div class="header_first">
            <img class="logo" src="Лого.webp" alt="Логотип">
        </div>
    </header>
    
    <main>
        <h1 class="title">Авторизация</h1>
        <img class="reg_image" src="Авторизоция_картинка.webp" alt="Регистрация">
        <form class="ra_form" action="#">
            <input class="reg_auto_input" type="email" placeholder="Почта" required>
            <input class="reg_auto_input" type="password" placeholder="Пароль" required>
        </form>
        <button class="reg_auto_button" type="submit">Авторизоваться</button>    
        <div class="ra_a">
            <a href="registration.html">Зарегистрируйтесь, если у вас нет аккаунта</a>
        </div>
    </main>

    <footer>
        <img class="image_footer" src="Макс.webp" alt="Макс">
        <img class="image_footer" src="Лого.webp" alt="Лого">
        <img class="image_footer" src="ВК.webp" alt="Вконтакте">
    </footer>
    <script src="script.js"></script>
</body>
</html>
