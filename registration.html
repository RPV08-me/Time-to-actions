<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500;600;700;800&family=Marck+Script&family=Playwrite+IT+Trad:wght@100..400&display=swap" rel="stylesheet">
    <link rel="icon" href="Лого.webp" type="image/x-icon">
    <link rel="stylesheet" href="reg_auto.css">
    <title>Регистрация "Время действий"</title>
</head>
<body>
     <header>
        <div class="header_first">
            <img class="logo" src="Лого.webp" alt="Логотип">
        </div>
    </header>
    
    <main>
        <h1 class="title">Регистрация</h1>
        <img class="reg_image" src="Регистрация_картинка.webp" alt="Регистрация">
        <form class="ra_form" action="#">
            <input class="reg_auto_input" type="text" placeholder="Имя" required>
            <input class="reg_auto_input" type="email" placeholder="Почта" required>
            <input class="reg_auto_input" type="tel" placeholder="Телефон" required>
            <input class="reg_auto_input" type="password" placeholder="Пароль" required>
            
            <button class="reg_auto_button" type="submit">Зарегистрироваться</button>
            
            <div class="ra_a">
                <a href="auto.html">Авторизуйтесь, если у вас есть аккаунт</a>
            </div>
        </form>
    </main>

    <footer>
        <img class="image_footer" src="Макс.webp" alt="Макс">
        <img class="image_footer" src="Лого.webp" alt="Лого">
        <img class="image_footer" src="ВК.webp" alt="Вконтакте">
    </footer>
    <script src="script.js"></script>
</body>
</html>
