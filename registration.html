<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Флавикон.webp" type="image/x-icon">
    <link rel="stylesheet" href="reg_auto.css">
    <title>Регистрация "Время действий"</title>
</head>
<body>
    <header>
        <div class="header_first">
            <img class="logo" src="Лого.webp" alt="Логтип">
            <div class="links">
                <a class="link"><img src="Регистрация.webp" alt="Регистрация"></a>
                <a class="link"><img src="Личный_кабинет.webp" alt="Личный кабинет"></a>
            </div>
        </div>
        <div class="header_second">
            <h1>Цитата</h1>
            <img class="image_header" src="Картинка_в_шапке" alt="Картинка в шапке">
        </div>
    </header>
    <main>
        <h1 class="title">Регистрация</h1>
        <input class="reg_auto_input" type="text" placeholder="Имя">
        <input class="reg_auto_input" type="email" placeholder="Почта">
        <input class="reg_auto_input" type="tel" placeholder="Телефон">
        <button class="reg_auto_button"><a></a></button>
    </main>
    <footer>
        <img class="image_footer" src="Макс.webp" alt="Макс">
        <img class="image_footer" src="Лого.webp" alt="Лого">
        <img class="image_footer" src="ВК.webp" alt="Вконтакте">
    </footer>
    <script src="script.js"></script>
</body>
</html>
