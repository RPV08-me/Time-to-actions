<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="Лого.webp" type="image/x-icon">
    <link rel="stylesheet" href="reg.css">
    <title>Регистрация "Время действий"</title>
</head>
<body>
     <header>
        <div class="header_first">
            <img class="logo" src="Лого.webp" alt="Логотип">
        </div>
    </header>
    
    <main>
        <h1 class="title">Регистрация</h1>
        <img class="reg_image" src="Регистрация_картинка.webp" alt="Регистрация">
        <form class="ra_form" id="registrationForm" novalidate>
    <div class="input_group">
        <input class="reg_auto_input" 
        type="text" id="username" 
        name="username" 
        placeholder="Имя" 
        required 
        minlength="2" 
        maxlength="50">
        <span class="error_message" id="username_error"></span>
    </div>

    <div class="input_group">
        <input 
            class="reg_auto_input" 
            type="email" 
            id="email"
            name="email"
            placeholder="Почта" 
            required
        >
        <span class="error_message" id="email_error"></span>
    </div>

    <div class="input_group">
        <input 
            class="reg_auto_input" 
            type="tel" 
            id="phone"
            name="phone"
            placeholder="Телефон" 
            required
            pattern="\+?[0-9]{10,15}"
        >
        <span class="error_message" id="phone_error"></span>
    </div>

    <div class="input_group">
        <input 
            class="reg_auto_input" 
            type="password" 
            id="password"
            name="password"
            placeholder="Пароль" 
            required
            minlength="8">
            <span class="error_message" id="password_error"></span>
    </div>
    </form>
        <button class="reg_auto_button" type="submit" form="registrationForm">Зарегистрироваться</button>
            
        <div class="ra_a">
            <a href="auto.html">Авторизуйтесь, если у вас есть аккаунт</a>
        </div>
    </main>

    <footer>
        <img class="image_footer" src="Макс.webp" alt="Макс">
        <img class="image_footer" src="Лого.webp" alt="Лого">
        <img class="image_footer" src="ВК.webp" alt="Вконтакте">
    </footer>
    <script src="script.js"></script>
    <div class="modal_overlay" id="modalOverlay">
    <div class="modal">
        <p class="modal_message" id="modalMessage">Форма успешно отправлена.</p>
        <button class="modal_button" id="modalButton">Хорошо</button>
    </div>
</div>
</div>
</body>
</html>
