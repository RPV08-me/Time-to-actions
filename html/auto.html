<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="/img/Лого.webp" type="image/x-icon">
    <link rel="stylesheet" href="/css/auto.css">
    <title>Авторизация "Время действий"</title>
</head>
<body>
    <header>
        <div class="header_first">
            <img class="logo" id="logoBack" src="/img/Лого.webp" alt="Логотип">
        </div>
    </header>
    
    <main>
        <h1 class="title">Авторизация</h1>
        <img class="reg_image" src="/img/Авторизоция_картинка.webp" alt="Регистрация">
       <form class="ra_form" id="loginForm" novalidate>

    <div class="input_group">
        <input 
            class="reg_auto_input" 
            type="email" 
            id="email"
            name="email"
            placeholder="Почта" 
            required
        >
        <span class="error_message" id="email_error"></span>
    </div>

    <div class="input_group">
        <input 
            class="reg_auto_input" 
            type="password" 
            id="password"
            name="password"
            placeholder="Пароль" 
            required
            minlength="8">
            <span class="error_message" id="password_error"></span>
    </div>
    </form>
        <button class="reg_auto_button" type="submit" form="loginForm">Авторизоваться</button>    
        <div class="ra_a">
            <a href="/html/registration.html">Зарегистрируйтесь, если у вас нет аккаунта</a>
        </div>
    </main>

    <footer>
        <img class="image_footer" src="/img/Макс.webp" alt="Макс">
        <img class="image_footer" src="/img/Лого.webp" alt="Лого">
        <img class="image_footer" src="/img/ВК.webp" alt="Вконтакте">
    </footer>
    <script src="/js_client/common.js"></script>
     <script src="/js_client/auto.js"></script>
    <div class="modal_overlay" id="modalOverlay">
    <div class="modal">
        <p class="modal_message" id="modalMessage">Форма успешно отправлена.</p>
        <button class="modal_button" id="modalButton">Хорошо</button>
    </div>
</body>
</html>
