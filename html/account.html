<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/img/Лого.webp" type="image/x-icon">
    <link rel="stylesheet" href="/css/account.css">
    <title>Личный кабинет "Время действий"</title>
</head>
<body>
    <header>
        <div class="header_first">
            <img class="logo" id="logoBack" src="/img/Лого.webp" alt="Логотип">
        </div>
    </header>

    <main>
        <h1 class="greeting_text" id="greetingText">Здравствуйте, Полина!</h1>

        <section class="information_section">
            <div class="photo_container">
                <img class="img_information" id="userAvatar" src="/img/Контакт.webp" alt="Аватар">
                <button class="photo_button">Фото +</button>
            </div>
            <div class="information_text">
                <input class="reg_auto_input" type="text" id="userName" placeholder="Имя">
                <input class="reg_auto_input" type="email" id="userEmail" placeholder="Почта">
                <input class="reg_auto_input" type="tel" id="userPhone" placeholder="Телефон">
            </div>
        </section>

        <section class="habits_section">
            <h2 class="section_title">Привычки</h2>
            <div class="habits_grid" id="habitsGrid"></div>
            <button class="add_habit_button" id="addHabitBtn">Добавить привычку</button>
        </section>
<div class="modal_overlay" id="habitModal">
            <div class="modal habit_modal">
                <div class="habit_modal_header">
                    <h3>Новая привычка</h3>
                    <button class="close_modal_btn" id="closeHabitBtn"><img src="/img/Плюсик.webp"></button>
                </div>
                
                <div class="habit_modal_body">
                    <div class="habit_photo_section">
                        <div class="habit_preview" id="habitPreview">
                            <span class="plus_icon">+</span>
                        </div>
                        <button class="photo_upload_btn" type="button" id="uploadHabitPhotoBtn">Фото +</button>
                        <input type="file" id="h_img" accept="image/*" style="display: none;">
                    </div>
                    <div class="habit_inputs_section">
                        <input type="text" id="h_name" class="reg_auto_input" placeholder="Название привычки">

                        <input type="time" id="h_time" class="reg_auto_input" placeholder="Время">
                    </div>
                </div>

                <button class="habit_submit_btn" id="saveHabit">Добавить</button>
            </div>
        </div>
        <div class="modal_overlay" id="habitCheckModal">
    <div class="modal habit_check_modal">
        <p id="checkHabitText" style="text-align: center; font-size: 24px; color: #D09CD0; font-weight: bold; margin-bottom: 30px;">
            Вы выполнили?
        </p>
        
        <div style="display: flex; gap: 15px; justify-content: center;">
            <button class="modal_button" id="checkHabitYes" style="background: #D09CD0; color: white;">Да</button>
            <button class="modal_button" id="checkHabitNo" style="background: #f0f0f0; color: #333;">Нет</button>
        </div>
    </div>
</div>
        <section class="habits_table_section">
            <h2 class="section_title">Прогресс привычек</h2>
            <div class="table_container" style="overflow-x: auto;">
                <table class="habits_table" id="habitsTable">
                    <thead>
                        <tr>
                            <th>Привычка</th>
                            <th>Пн</th>
                            <th>Вт</th>
                            <th>Ср</th>
                            <th>Чт</th>
                            <th>Пт</th>
                            <th>Сб</th>
                            <th>Вс</th>
                        </tr>
                    </thead>
                    <tbody id="habitsTableBody">
                    </tbody>
                </table>
            </div>
        </section>

        <section class="time_section">
            <h2 class="section_title">Время</h2>
            <div class="time_grid">
                <div class="time_card">
                    <div class="time_icon"><img src="/img/Учеба.webp"></div>
                    <span class="time_name">Учеба</span>
                </div>
                <div class="time_card">
                    <div class="time_icon"><img src="/img/Хобби.webp"></div>
                    <span class="time_name">Хобби</span>
                </div>
                <div class="time_card">
                    <div class="time_icon"><img src="/img/Работа.webp"></div>
                    <span class="time_name">Работа</span>
                </div>
                <div class="time_card">
                    <div class="time_icon"><img src="/img/Уборка.webp"></div>
                    <span class="time_name">Домашние дела</span>
                </div>
            </div>
            <a href="/html/time.html" class="timer_button" style="display:block; text-align:center; text-decoration:none;">Таймер</a>
        </section>

        <section class="chart_section">
            <h2 class="section_title">График времени</h2>
            <div class="chart_container">
                <canvas id="timeChart"></canvas>
            </div>
        </section>
    </main>
    <div class="modal_overlay" id="modalOverlay">
        <div class="modal" style="text-align: center; padding: 40px 30px; max-width: 400px;">
            <p class="modal_message" id="modalMessage" style="font-size: 22px; color: #333; margin-bottom: 25px;"></p>
            <button class="modal_button" id="modalButton" style="background: #D09CD0; color: white; padding: 10px 30px; border-radius: 8px; font-size: 16px; border: none; cursor: pointer;">ОК</button>
        </div>
    </div>
    <footer>
        <img class="image_footer" src="/img/Макс.webp" alt="Макс">
        <img class="image_footer" src="/img/Лого.webp" alt="Лого">
        <img class="image_footer" src="/img/ВК.webp" alt="Вконтакте">
    </footer>
    <button id="scrollTopBtn" title="Наверх">↑</button>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/js_client/common.js"></script>
    <script src="/js_client/account.js"></script>
</body>
</html>
